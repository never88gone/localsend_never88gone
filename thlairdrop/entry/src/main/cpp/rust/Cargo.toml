[package]
name = "localsend_harmony"
version = "0.1.0"
edition = "2021"

[lib]
name = "localsend_harmony"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# 使用共享的 localsend core 库
localsend = { path = "../../../../../../core", features = ["http"] }

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 线程安全
once_cell = "1"

[build-dependencies]
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
